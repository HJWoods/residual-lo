[project]
name = "residual-lo"
version = "0.1.0"
description = "Discrete residual linear-operator layers (BinaryGate + hypernet affine, ResidualLOConv)"
readme = "README.md"
authors = [
    { name = "HJWoods", email = "hector.woods5527@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4.0",
]

[project.optional-dependencies]
vision = [
    "pillow>=10.0.0",
    "torchvision>=0.19.0",
    "tqdm>=4.70.0",
]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/residual_lo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "experiments"]
