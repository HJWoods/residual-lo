[project]
name = "residual-lo"
version = "0.1.0"
description = "Discrete Bottleneck Layers (BinaryGate STE + hypernet affine Δ(c))"
readme = "README.md"
authors = [
    { name = "HJWoods", email = "hector.woods5527@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/residual_lo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
